# ==============================================================================
# EquiTrafficAI - FastAPI Master Backend Server Configuration
# ==============================================================================

server:
  app_name: "EquiTraffic-GPT Master API"
  version: "2.0.0"
  description: "SOTA Traffic LLM Copilot & Graph WaveNet (GWNet) Neural Forecasting API"
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  docs_url: "/docs"
  redoc_url: "/redoc"
  cors_allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
    - "*"

openapi_tags:
  - name: "Telemetry & State"
    description: "Complete sensor telemetry & topological edge graph endpoints"
  - name: "Analytics"
    description: "Dynamic Pareto Equity & Anomaly Metrics"
  - name: "Neural Forecasting & GWNet"
    description: "Graph WaveNet (GWNet) 15-Minute Neural Tensor Prediction Engine"
  - name: "Routing & Navigation"
    description: "Smart A* Origin-Destination Rerouting & Bottleneck Avoidance"
  - name: "Causal Diagnostics"
    description: "Level-3 Structural Causal Model (SCM) Direct & Indirect Effect Mediation"
  - name: "Policy Advisor"
    description: "Pareto Optimal Reliability Policy Advisory"
  - name: "MLOps Training"
    description: "Non-Blocking Asynchronous Background PyTorch Model Training Worker"
  - name: "AI Copilot"
    description: "Google Gemini Flash 2.5 Lite Natural Language Traffic Advisory"

datasets:
  data_directory_candidates:
    - "./data"
    - "../data"
    - "./EquiTrafficAI/data"
  active_corridors:
    la:
      name: "Los Angeles METR-LA"
      sensor_count: 207
      metadata_file: "metr_la_metrics.csv"
      history_file: "metr_la_his.npz"
      distance_matrix: "distances.csv"
      location_map: "la_sensor_location_map.json"
      precomputed_adjacency: "adj_metr_la.pkl"
    sd:
      name: "San Diego SD400"
      sensor_count: 716
      metadata_file: "sd_meta.csv"
      history_file: "sd400_his.npz"
      location_map: "sd_sensor_location_map.json"
      precomputed_adjacency: "adj_sd400.pkl"
    pems04:
      name: "SF Bay Area PeMS-04"
      sensor_count: 307
    pems08:
      name: "San Bernardino PeMS-08"
      sensor_count: 170
    pems_bay:
      name: "Bay Area PeMS-BAY"
      sensor_count: 325
    pems03:
      name: "Sacramento PeMS-03"
      sensor_count: 358
    pems07:
      name: "Greater LA PeMS-07"
      sensor_count: 883

routing_engine:
  max_search_depth: 15
  free_flow_speed_mph: 65.0
  heavy_congestion_speed_mph: 22.5
  reroute_time_saved_multiplier: 1.25
  spatial_haversine_max_radius_miles: 3.5

anomaly_detection:
  cusum_threshold: 3.5
  ewma_alpha: 0.2
  persistence_error_window: 12
  zero_rate_threshold: 0.40

caching:
  enable_in_memory_tensor_cache: true # Pre-loads metr_la_his.npz & sd400_his.npz into RAM (< 1ms API latency)
  cache_ttl_seconds: 3600
