[tool.poetry]
name = "metr-la-dissertation"
version = "2.0.0"
description = "Structural Causal Digital Twin Framework for METR-LA Spatial Fairness Auditing"
authors = ["Student <student@university.edu>"]
readme = "README.md"
packages = [
    {include = "EquiTrafficAI"},
    {include = "final_package"}
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
torch = "^2.1.0"
fastapi = "^0.136.0"
uvicorn = "^0.45.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.0"
networkx = "^3.0"
requests = "^2.31.0"
langchain-core = "^0.3.0"
langchain-google-genai = "^2.0.0"
langchain-groq = "^0.2.0"
pandas = "^2.0.0"
scipy = "^1.10.0"
matplotlib = "^3.7.0"
scikit-learn = "^1.2.0"
datasets = "^2.12.0"
huggingface-hub = "^0.14.0"
dowhy = "^0.11"
numba = "^0.58.0"
hypothesis = "^6.80.0"

[tool.poetry.group.dev.dependencies]
pylint = "^3.0.0"
ruff = "^0.1.0"
mypy = "^1.5.0"
vulture = "^2.9"
radon = "^6.0.0"
refurb = "^2.0.0"
mutatest = "^0.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
