# ============================================================================
# EquiTraffic-GPT CI/CD Pipeline
# ============================================================================

name: EquiTraffic-GPT CI/CD Pipeline

on:
  push:
    branches: [full-production-v2.0, main]
  pull_request:
    branches: [full-production-v2.0, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================================
  # 1. FRONTEND REACT & WEB GIS CI
  # ==========================================================================
  frontend-ci:
    name: Frontend React Build & YAML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ----------------------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------------------
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # NODE.JS
      # ----------------------------------------------------------------------
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EquiTrafficAI/frontend/package-lock.json

      # ----------------------------------------------------------------------
      # FRONTEND DEPENDENCIES
      # ----------------------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: EquiTrafficAI/frontend
        run: npm ci

      # ----------------------------------------------------------------------
      # FRONTEND YAML VALIDATION
      # ----------------------------------------------------------------------
      - name: Validate Frontend YAML Config
        run: |
          node -e "
          const fs = require('fs');

          const file = fs.readFileSync(
            'EquiTrafficAI/frontend/frontend_config.yaml',
            'utf8'
          );

          console.log(
            '[+] frontend_config.yaml successfully loaded (' +
            file.length +
            ' bytes)'
          );
          "

      # ----------------------------------------------------------------------
      # VITE PRODUCTION BUILD
      # ----------------------------------------------------------------------
      - name: Run Production Bundle Build (Vite)
        working-directory: EquiTrafficAI/frontend
        run: npm run build


  # ==========================================================================
  # 2. BACKEND FASTAPI & DEEP LEARNING MODEL CI
  # ==========================================================================
  backend-ci:
    name: Backend FastAPI & GWNet GNN Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ----------------------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------------------
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # PYTHON 3.11
      # ----------------------------------------------------------------------
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # ----------------------------------------------------------------------
      # PYTHON DEPENDENCIES
      #
      # requirements.txt is the single source of truth.
      # This includes python-dotenv>=1.0.0.
      # ----------------------------------------------------------------------
      - name: Install Python Backend & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ----------------------------------------------------------------------
      # YAML CONFIGURATION VALIDATION
      # ----------------------------------------------------------------------
      - name: Validate Backend & Model YAML Schemas
        run: |
          python - <<'PY'
          import yaml

          with open(
              'EquiTrafficAI/backend/backend_config.yaml',
              'r',
              encoding='utf-8'
          ) as f:
              backend_cfg = yaml.safe_load(f)

          with open(
              'EquiTrafficAI/backend/model_config.yaml',
              'r',
              encoding='utf-8'
          ) as f:
              model_cfg = yaml.safe_load(f)

          assert backend_cfg['server']['app_name'] == 'EquiTraffic-GPT Master API'

          assert (
              model_cfg['graph_wavenet_gnn']['architecture']
              ['num_nodes_metr_la'] == 207
          )

          assert (
              model_cfg['graph_wavenet_gnn']['architecture']
              ['num_nodes_sd400'] == 716
          )

          print(
              '[+] backend_config.yaml valid:',
              backend_cfg['server']['app_name']
          )

          print(
              '[+] model_config.yaml valid: '
              'GraphWaveNet metadata verified'
          )
          PY

      # ----------------------------------------------------------------------
      # PYTHON SYNTAX VALIDATION
      # ----------------------------------------------------------------------
      - name: AST Syntax Compilation Check
        run: |
          python -m compileall -q \
            backend.py \
            EquiTrafficAI/backend \
            EquiTrafficAI/gwnet

          echo "[+] Python syntax compilation passed."

      # ----------------------------------------------------------------------
      # BACKEND PACKAGE IMPORT VALIDATION
      # ----------------------------------------------------------------------
      - name: Validate Backend Package Imports
        run: |
          python - <<'PY'
          import os
          import sys

          repo_root = os.path.abspath('.')

          if repo_root not in sys.path:
              sys.path.insert(0, repo_root)

          from EquiTrafficAI.backend.backend import app
          from EquiTrafficAI.backend.llm_engine import TrafficLLMEngine

          assert app.title == 'EquiTraffic-GPT Master API'

          engine = TrafficLLMEngine()

          assert engine.model_name, (
              'LLM model name was not resolved'
          )

          print(
              '[+] FastAPI application imported:',
              app.title
          )

          print(
              '[+] Current LLM engine:',
              type(engine).__name__
          )

          print(
              '[+] Resolved LLM model:',
              engine.model_name
          )
          PY

      # ----------------------------------------------------------------------
      # GWNET ADAPTER VALIDATION
      # ----------------------------------------------------------------------
      - name: Validate GWNet Adapter Metadata
        run: |
          python - <<'PY'
          import os
          import sys

          gwnet_dir = os.path.abspath('EquiTrafficAI/gwnet')

          if gwnet_dir not in sys.path:
              sys.path.insert(0, gwnet_dir)

          from gwnet_adapter import UniversalPeMSAdapter

          adapter_la = UniversalPeMSAdapter('metr_la')
          adapter_sd = UniversalPeMSAdapter('sd400')

          assert adapter_la.num_nodes == 207, adapter_la.num_nodes
          assert adapter_sd.num_nodes == 716, adapter_sd.num_nodes

          print(
              '[+] METR-LA adapter nodes:',
              adapter_la.num_nodes
          )

          print(
              '[+] SD400 adapter nodes:',
              adapter_sd.num_nodes
          )
          PY

      # ----------------------------------------------------------------------
      # FASTAPI ROUTE VALIDATION
      #
      # FastAPI can contain nested IncludedRouter objects. Recursively inspect
      # all nested routers so the actual application routes are discovered.
      # ----------------------------------------------------------------------
      - name: Validate FastAPI Routes
        run: |
          python - <<'PY'
          from EquiTrafficAI.backend.backend import app

          def collect_routes(router):
              paths = set()

              for route in getattr(router, 'routes', []):
                  path = getattr(route, 'path', None)

                  if path:
                      paths.add(path)

                  nested_routes = getattr(route, 'routes', None)

                  if nested_routes:
                      paths.update(collect_routes(route))

              return paths

          routes = collect_routes(app)

          required_routes = {
              '/api/health/models',
              '/api/state',
              '/api/predict/congestion_15min',
              '/api/llm/reasoning',
              '/api/route/plan',
              '/docs',
              '/map',
              '/predict',
              '/reroute',
          }

          missing = required_routes - routes

          print(
              '[+] Discovered routes:',
              sorted(routes)
          )

          print(
              '[+] Required routes:',
              sorted(required_routes)
          )

          print(
              '[+] Missing routes:',
              sorted(missing)
          )

          assert not missing, (
              f'Missing API routes: {sorted(missing)}'
          )

          print(
              '[+] Required FastAPI routes verified.'
          )
          PY

      # ----------------------------------------------------------------------
      # ROOT BACKEND LAUNCHER VALIDATION
      # ----------------------------------------------------------------------
      - name: Test Root Backend Launcher
        run: |
          python - <<'PY'
          import backend

          assert backend.app.title == 'EquiTraffic-GPT Master API'

          print(
              '[+] Root backend.py launcher imports successfully.'
          )
          PY