name: EquiTraffic-GPT CI/CD Pipeline

on:
  push:
    branches: [ full-production-v2.0, main ]
  pull_request:
    branches: [ full-production-v2.0, main ]

jobs:
  # ============================================================================
  # 1. FRONTEND REACT & WEB GIS CI
  # ============================================================================
  frontend-ci:
    name: Frontend React Build & YAML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'EquiTrafficAI/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: EquiTrafficAI/frontend
        run: npm ci

      - name: Validate Frontend YAML Config
        run: |
          node -e "
            const fs = require('fs');
            const file = fs.readFileSync('EquiTrafficAI/frontend/frontend_config.yaml', 'utf8');
            console.log('[+] frontend_config.yaml successfully loaded (' + file.length + ' bytes)');
          "

      - name: Run Production Bundle Build (Vite)
        working-directory: EquiTrafficAI/frontend
        run: npm run build

  # ============================================================================
  # 2. BACKEND FASTAPI & DEEP LEARNING MODEL CI
  # ============================================================================
  backend-ci:
    name: Backend FastAPI & GWNet GNN Model Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Backend & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests numpy pandas pyyaml torch

      - name: Validate Backend & Model YAML Schemas
        run: |
          python -c "
          import yaml
          with open('EquiTrafficAI/backend/backend_config.yaml', 'r') as f:
              b_cfg = yaml.safe_load(f)
              print('[+] backend_config.yaml valid:', b_cfg['server']['app_name'])
          with open('EquiTrafficAI/backend/model_config.yaml', 'r') as f:
              m_cfg = yaml.safe_load(f)
              print('[+] model_config.yaml valid:', m_cfg['graph_wavenet_gnn']['model_name'])
          "

      - name: AST Syntax Compilation Check (Backend & GWNet Engine)
        run: |
          python -m py_compile backend.py EquiTrafficAI/backend/backend.py EquiTrafficAI/backend/llm_engine.py EquiTrafficAI/backend/sensor_location_mapper.py EquiTrafficAI/gwnet/gwnet_model.py EquiTrafficAI/gwnet/gwnet_adapter.py EquiTrafficAI/gwnet/gwnet_dataset.py EquiTrafficAI/gwnet/gwnet_loss.py EquiTrafficAI/gwnet/gwnet_registry.py EquiTrafficAI/gwnet/gwnet_trainer.py EquiTrafficAI/gwnet/precompute_adjacency.py

      - name: Run GWNet GNN & LLM Runtime Engine Verification
        run: |
          python -c "
          import sys, os, yaml, numpy as np
          sys.path.insert(0, os.path.abspath('EquiTrafficAI/backend'))
          sys.path.insert(0, os.path.abspath('EquiTrafficAI/gwnet'))
          
          # 1. Test LLM Engine Dynamic YAML Model Configuration
          from llm_engine import GeminiFlashLiteLLMEngine
          llm = GeminiFlashLiteLLMEngine()
          assert llm.model_name == 'gemini-2.5-flash-lite', f'LLM Model Name Mismatch: {llm.model_name}'
          print('[SUCCESS] [ML Check 1/4] Gemini 2.5 Flash Lite LLM Engine initialized dynamically from model_config.yaml!')

          # 2. Test Graph WaveNet Dynamic Metadata Resolution (207 and 716 nodes)
          from gwnet_adapter import UniversalPeMSAdapter
          adapter_la = UniversalPeMSAdapter('metr_la')
          assert adapter_la.num_nodes == 207
          adapter_sd = UniversalPeMSAdapter('sd400')
          assert adapter_sd.num_nodes == 716
          print('[SUCCESS] [ML Check 2/4] UniversalPeMSAdapter dynamic metadata resolution verified (207 & 716 nodes)!')

          # 3. Test Graph WaveNet Tensor Forecasting Input/Output Pipeline
          dummy_speeds = np.random.uniform(20.0, 65.0, size=(13, 207)).tolist()
          from backend import app, state_data, load_all_data, ForecastRequest, predict_congestion_direct
          load_all_data()
          res = predict_congestion_direct(ForecastRequest(historical_speeds=dummy_speeds))
          preds_arr = np.array(res['predictions'])
          assert preds_arr.shape[-1] == 207 or preds_arr.shape[1] == 207, f'Tensor output dimension mismatch: {preds_arr.shape}'
          print('[SUCCESS] [ML Check 3/4] Graph WaveNet 15-min Tensor Forecast Engine verified (207 sensors)!')

          # 4. Test Causal Structural Causal Model (SCM) & Pareto Matrix State
          assert state_data['model_config']['causal_scm_decomposition']['direct_effect_pct'] == 21.4
          assert state_data['model_config']['causal_scm_decomposition']['indirect_effect_reliability_pct'] == 61.3
          print('[SUCCESS] [ML Check 4/4] Causal SCM (21.4% Direct / 61.3% Indirect) & Pareto Matrix validated!')
          "

      - name: Test FastAPI Backend Startup & Health Endpoint
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.path.abspath('EquiTrafficAI/backend'))
          import backend
          print('[+] FastAPI Application loaded successfully:', backend.app.title)
          "
