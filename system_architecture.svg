<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>

    <linearGradient id="blue-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="100%" stop-color="#BEE3F8" />
    </linearGradient>

    <linearGradient id="teal-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#B2F5EA" />
    </linearGradient>

    <linearGradient id="purple-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#E9D8FD" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4A5568" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="url(#header-grad)" filter="url(#drop-shadow)" />
  <text x="500" y="46" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle">PROPOSED SYSTEM ARCHITECTURE</text>
  <text x="500" y="66" fill="#E2E8F0" font-size="12" text-anchor="middle">(Structural Causal Digital Twin Framework - Proposal Stage Specification)</text>

  <!-- ================= COLUMN 1: DATA INGESTION & PREPROCESSING ================= -->
  <!-- Header Card 1 -->
  <rect x="40" y="100" width="280" height="36" rx="6" fill="#2B6CB0" />
  <text x="180" y="123" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">1. Data Ingestion & Preprocessing</text>

  <!-- Box 1A: Telemetry Ingestion -->
  <rect x="40" y="150" width="280" height="100" rx="8" fill="url(#blue-box)" stroke="#3182CE" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="180" y="175" fill="#1A365D" font-size="13" font-weight="bold" text-anchor="middle">Proposed Telemetry Ingestion</text>
  <line x1="60" y1="183" x2="300" y2="183" stroke="#CBD5E0" stroke-width="1" />
  <text x="60" y="202" fill="#2D3748" font-size="11">• Highway Traffic Telemetry (METR-LA)</text>
  <text x="60" y="220" fill="#2D3748" font-size="11">• 5-Minute Sampling Aggregation</text>
  <text x="60" y="238" fill="#2D3748" font-size="11">• 60-Minute Sequence Window</text>

  <!-- Arrow 1A -> 1B -->
  <path d="M 180 250 L 180 270" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Box 1B: Planned Preprocessing & Disentanglement -->
  <rect x="40" y="275" width="280" height="180" rx="8" fill="url(#blue-box)" stroke="#3182CE" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="180" y="298" fill="#1A365D" font-size="13" font-weight="bold" text-anchor="middle">Planned Preprocessing & Disentanglement</text>
  <line x1="60" y1="306" x2="300" y2="306" stroke="#CBD5E0" stroke-width="1" />
  <rect x="55" y="315" width="250" height="30" rx="4" fill="#FFFFFF" stroke="#90CDF4" />
  <text x="180" y="335" fill="#2B6CB0" font-size="11" text-anchor="middle">Z-Score Speed Normalization</text>
  
  <rect x="55" y="352" width="250" height="30" rx="4" fill="#FFFFFF" stroke="#90CDF4" />
  <text x="180" y="372" fill="#2B6CB0" font-size="11" text-anchor="middle">True Zero vs. Stuck-Zero Disentanglement</text>
  
  <rect x="55" y="389" width="250" height="30" rx="4" fill="#FFFFFF" stroke="#90CDF4" />
  <text x="180" y="409" fill="#2B6CB0" font-size="11" text-anchor="middle">CUSUM Drift & EWMA Volatility Extraction</text>
  
  <rect x="55" y="426" width="250" height="22" rx="4" fill="#E2E8F0" />
  <text x="180" y="441" fill="#4A5568" font-size="10" font-weight="bold" text-anchor="middle">Composite Reliability Index (R_i)</text>

  <!-- ================= COLUMN 2: GRAPH PARTITIONING & FORECASTING ================= -->
  <!-- Arrow Col1 -> Col2 -->
  <path d="M 320 365 L 350 365" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Header Card 2 -->
  <rect x="360" y="100" width="280" height="36" rx="6" fill="#319795" />
  <text x="500" y="123" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">2. Graph Partitioning & Modeling</text>

  <!-- Box 2A: Graph Laplacian -->
  <rect x="360" y="150" width="280" height="120" rx="8" fill="url(#teal-box)" stroke="#319795" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="500" y="173" fill="#134E4A" font-size="13" font-weight="bold" text-anchor="middle">Proposed Graph Laplacian Partitioning</text>
  <line x1="380" y1="181" x2="620" y2="181" stroke="#CBD5E0" stroke-width="1" />
  <text x="380" y="200" fill="#2D3748" font-size="11">• Spatial Distance Adjacency Matrix (W_adj)</text>
  <text x="380" y="218" fill="#2D3748" font-size="11">• Symmetric Normalized Laplacian (L_sym)</text>
  <text x="380" y="236" fill="#2D3748" font-size="11">• Spectral Eigen-gap Partitioning (K Districts)</text>
  <text x="380" y="254" fill="#2D3748" font-size="11">• Regional Equity Partitioning</text>

  <!-- Arrow 2A -> 2B -->
  <path d="M 500 270 L 500 290" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Box 2B: Forecasting Models Benchmark -->
  <rect x="360" y="295" width="280" height="180" rx="8" fill="url(#teal-box)" stroke="#319795" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="500" y="318" fill="#134E4A" font-size="13" font-weight="bold" text-anchor="middle">Forecasting Models Benchmark Suite</text>
  <line x1="380" y1="326" x2="620" y2="326" stroke="#CBD5E0" stroke-width="1" />
  
  <rect x="375" y="335" width="250" height="28" rx="4" fill="#FFFFFF" stroke="#81E6D9" />
  <text x="500" y="353" fill="#2C7A7B" font-size="11" text-anchor="middle">Historical Average (Statistical Baseline)</text>
  
  <rect x="375" y="368" width="250" height="28" rx="4" fill="#FFFFFF" stroke="#81E6D9" />
  <text x="500" y="386" fill="#2C7A7B" font-size="11" text-anchor="middle">DLinear (Non-Graph Temporal Baseline)</text>
  
  <rect x="375" y="401" width="250" height="28" rx="4" fill="#FFFFFF" stroke="#81E6D9" />
  <text x="500" y="419" fill="#2C7A7B" font-size="11" text-anchor="middle">DCRNN (Recurrent Diffusion GNN)</text>
  
  <rect x="375" y="434" width="250" height="28" rx="4" fill="#FFFFFF" stroke="#81E6D9" />
  <text x="500" y="452" fill="#2C7A7B" font-size="11" text-anchor="middle">Graph WaveNet (Adaptive ST-GNN)</text>

  <!-- Arrow 2B -> 2C -->
  <path d="M 500 475 L 500 495" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Box 2C: Evaluation Protocol -->
  <rect x="360" y="500" width="280" height="110" rx="8" fill="url(#teal-box)" stroke="#319795" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="500" y="523" fill="#134E4A" font-size="13" font-weight="bold" text-anchor="middle">Planned Evaluation Protocol</text>
  <line x1="380" y1="531" x2="620" y2="531" stroke="#CBD5E0" stroke-width="1" />
  <text x="380" y="550" fill="#2D3748" font-size="11">• Multi-Horizon Evaluation (15m / 30m / 60m)</text>
  <text x="380" y="568" fill="#2D3748" font-size="11">• Train / Val / Test Split (70% / 10% / 20%)</text>
  <text x="380" y="586" fill="#2D3748" font-size="11">• Accuracy: MAE, RMSE, MAPE</text>
  <text x="380" y="604" fill="#2D3748" font-size="11">• Equity: Regional Static Fairness (RSF)</text>

  <!-- ================= COLUMN 3: STRUCTURAL CAUSAL MODEL & DIGITAL TWIN ================= -->
  <!-- Arrow Col2 -> Col3 -->
  <path d="M 640 365 L 670 365" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Header Card 3 -->
  <rect x="680" y="100" width="280" height="36" rx="6" fill="#805AD5" />
  <text x="820" y="123" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">3. Causal Twin & Decision Support</text>

  <!-- Box 3A: Target SCM & Mediation -->
  <rect x="680" y="150" width="280" height="180" rx="8" fill="url(#purple-box)" stroke="#805AD5" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="820" y="173" fill="#441D82" font-size="13" font-weight="bold" text-anchor="middle">Target Structural Causal Model (SCM)</text>
  <line x1="700" y1="181" x2="940" y2="181" stroke="#CBD5E0" stroke-width="1" />
  
  <rect x="695" y="190" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D6BCFA" />
  <text x="820" y="206" fill="#553C9A" font-size="11" font-weight="bold" text-anchor="middle">Pearl Level-3 Causal DAG</text>
  <text x="820" y="220" fill="#6B46C1" font-size="10" text-anchor="middle">Backdoor Criterion Adjustment Set</text>
  
  <rect x="695" y="234" width="250" height="84" rx="4" fill="#FFFFFF" stroke="#D6BCFA" />
  <text x="820" y="250" fill="#553C9A" font-size="11" font-weight="bold" text-anchor="middle">Counterfactual Mediation Analysis</text>
  <text x="705" y="268" fill="#2D3748" font-size="10">• Direct Traffic Effect Path (Ctf-DE)</text>
  <text x="705" y="284" fill="#2D3748" font-size="10">• Indirect Hardware Reliability Path (Ctf-IE_R)</text>
  <text x="705" y="300" fill="#2D3748" font-size="10">• Indirect Graph Topology Path (Ctf-IE_T)</text>
  <text x="705" y="314" fill="#2D3748" font-size="10">• Spurious Confounding Path (Ctf-SE)</text>

  <!-- Arrow 3A -> 3B -->
  <path d="M 820 330 L 820 350" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Box 3B: Expected Digital Twin & GIS Decision Support -->
  <rect x="680" y="355" width="280" height="255" rx="8" fill="url(#purple-box)" stroke="#805AD5" stroke-width="1.5" filter="url(#drop-shadow)" />
  <text x="820" y="378" fill="#441D82" font-size="13" font-weight="bold" text-anchor="middle">Expected Digital Twin & Decision Support</text>
  <line x1="700" y1="386" x2="940" y2="386" stroke="#CBD5E0" stroke-width="1" />
  
  <rect x="695" y="398" width="250" height="50" rx="4" fill="#FFFFFF" stroke="#D6BCFA" />
  <text x="820" y="416" fill="#553C9A" font-size="11" font-weight="bold" text-anchor="middle">Virtual Interventional Twin Engine</text>
  <text x="820" y="434" fill="#6B46C1" font-size="10" text-anchor="middle">Counterfactual Repair Queries do(R_i = r)</text>

  <rect x="695" y="456" width="250" height="50" rx="4" fill="#FFFFFF" stroke="#D6BCFA" />
  <text x="820" y="474" fill="#553C9A" font-size="11" font-weight="bold" text-anchor="middle">Regional Equity Remediation</text>
  <text x="820" y="492" fill="#6B46C1" font-size="10" text-anchor="middle">RSF Disparity Reduction Target</text>

  <rect x="695" y="514" width="250" height="84" rx="4" fill="#FFFFFF" stroke="#D6BCFA" />
  <text x="820" y="532" fill="#553C9A" font-size="11" font-weight="bold" text-anchor="middle">Planned Interactive GIS Map Console</text>
  <text x="705" y="550" fill="#2D3748" font-size="10">• Spatial Sensor Health Map (Healthy/Drift/Failed)</text>
  <text x="705" y="566" fill="#2D3748" font-size="10">• Multi-Horizon Equity Dashboard</text>
  <text x="705" y="582" fill="#2D3748" font-size="10">• Infrastructure Maintenance Decision Support</text>

  <!-- Caption Footer -->
  <text x="500" y="745" fill="#1A202C" font-size="16" font-weight="bold" text-anchor="middle">Fig. 9.1 Proposed System Architecture</text>
</svg>
